<!DOCTYPE html>
<html lang="si">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>සාමාජික පැතිකඩ | Divisional Federation of YOUTH CLUBS - Gampaha</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen p-4 md:p-8 flex items-center justify-center">

  <div class="max-w-md w-full bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-200">
    <!-- Header banner -->
    <div class="bg-blue-900 text-white p-4 text-center relative">
      <h2 class="text-sm font-bold uppercase tracking-wider text-amber-300">Divisional Federation of Youth Clubs</h2>
      <p class="text-xs text-slate-200">Official Member Profile</p>
    </div>

    <!-- Profile Content -->
    <div class="p-6 space-y-6 text-center">
      
      <!-- Photo -->
      <div class="flex justify-center">
        <div class="w-24 h-24 rounded-full border-4 border-amber-400 shadow-md overflow-hidden bg-slate-200">
          <img id="mPhoto" src="" alt="Member Photo" class="w-full h-full object-cover">
        </div>
      </div>

      <!-- Name & ID -->
      <div>
        <h1 id="mName" class="text-xl font-bold text-slate-900">-</h1>
        <p id="mPosition" class="text-xs font-semibold text-amber-600 uppercase mt-0.5">සාමාජික</p>
        <p id="mId" class="text-xs font-mono bg-blue-50 text-blue-800 inline-block px-2.5 py-1 rounded-full mt-2 font-bold">-</p>
      </div>

      <!-- Details Grid -->
      <div class="bg-slate-50 p-4 rounded-xl border text-left space-y-2 text-xs">
        <p><strong class="text-slate-500">යෞවන සමාජය:</strong> <span id="mClub" class="font-semibold text-slate-800">-</span></p>
        <p><strong class="text-slate-500">ග්‍රාම නිලධාරී වසම:</strong> <span id="mGn" class="font-semibold text-slate-800">-</span></p>
        <p><strong class="text-slate-500">ඊමේල් ලිපිනය:</strong> <span id="mEmail" class="font-semibold text-slate-800">-</span></p>
      </div>

      <!-- Stats Grid -->
      <div class="grid grid-cols-3 gap-2">
        <div class="bg-blue-50 border border-blue-100 p-2.5 rounded-xl text-center">
          <p class="text-[9px] text-blue-600 font-semibold uppercase">මුළු ලකුණු</p>
          <p id="mPoints" class="text-base font-bold text-blue-900">0</p>
        </div>
        <div class="bg-indigo-50 border border-indigo-100 p-2.5 rounded-xl text-center">
          <p class="text-[9px] text-indigo-600 font-semibold uppercase">වැඩසටහන්</p>
          <p id="mPrograms" class="text-base font-bold text-indigo-900">0</p>
        </div>
        <div class="bg-amber-50 border border-amber-100 p-2.5 rounded-xl text-center">
          <p class="text-[9px] text-amber-600 font-semibold uppercase">රැස්වීම්</p>
          <p id="mMeetings" class="text-base font-bold text-amber-900">0</p>
        </div>
      </div>

      <!-- Activity History Section -->
      <div class="text-left space-y-2 pt-2 border-t">
        <h3 class="text-xs font-bold text-blue-900 uppercase">සහභාගී වූ වැඩසටහන් හා රැස්වීම් ඉතිහාසය</h3>
        <div id="activityHistoryList" class="space-y-2 max-h-48 overflow-y-auto pr-1">
          <p class="text-xs text-slate-400 text-center py-2">වාර්තා කිසිවක් හමු නොවීය.</p>
        </div>
      </div>

    </div>

    <div class="bg-slate-50 p-3 text-center text-[10px] text-slate-400 border-t">
      Divisional Federation of YOUTH CLUBS - Gampaha © 2026
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://mlnojkidgdcvxbvhaqok.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_FaHnMWAtgbJQtv0eK7nfUQ_neppKu5W';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function loadProfile() {
      const urlParams = new URLSearchParams(window.location.search);
      const memberId = urlParams.get('id');

      if (!memberId) {
        alert("සාමාජික අංකයක් හමු නොවීය!");
        return;
      }

      const { data, error } = await supabaseClient
        .from('youth_members')
        .select('*')
        .eq('membership_id', memberId)
        .single();

      if (error || !data) {
        document.body.innerHTML = `<div class="text-center p-8"><h2 class="text-lg font-bold text-red-600">❌ සාමාජිකයා හමු නොවීය හෝ දෝෂයක් සිදු විය.</h2></div>`;
        return;
      }

      document.getElementById('mName').innerText = data.full_name;
      document.getElementById('mPosition').innerText = data.position || 'සාමාජික';
      document.getElementById('mId').innerText = data.membership_id;
      document.getElementById('mClub').innerText = data.youth_club;
      document.getElementById('mGn').innerText = data.gn_division;
      document.getElementById('mEmail').innerText = data.email;
      document.getElementById('mPoints').innerText = data.points || 0;
      document.getElementById('mPrograms').innerText = data.programs_count || 0;
      document.getElementById('mMeetings').innerText = data.meetings_count || 0;

      if (data.photo) {
        document.getElementById('mPhoto').src = data.photo;
      }

      // Render Activity History
      const historyContainer = document.getElementById('activityHistoryList');
      const history = data.activity_history;

      if (history && Array.isArray(history) && history.length > 0) {
        historyContainer.innerHTML = "";
        history.forEach(item => {
          const card = document.createElement('div');
          card.className = "bg-slate-50 border border-slate-200 p-2.5 rounded-lg text-xs space-y-1";
          card.innerHTML = `
            <div class="flex justify-between items-center font-bold text-blue-900">
              <span>${item.name}</span>
              <span class="text-[10px] bg-amber-100 text-amber-800 px-1.5 py-0.5 rounded">${item.type} (+${item.points} pts)</span>
            </div>
            <p class="text-[10px] text-slate-500">දිනය: ${item.date}</p>
            ${item.description ? `<p class="text-[11px] text-slate-700">${item.description}</p>` : ''}
          `;
          historyContainer.appendChild(card);
        });
      }
    }

    loadProfile();
  </script>
</body>
</html>
